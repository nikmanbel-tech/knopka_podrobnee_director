<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    .button-group {
      border-radius: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 15px 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: background-color .2s ease, box-shadow .2s ease, transform .1s ease;
      border: none;
    }

    .btn-primary {
      background-color: #1e88e5;
      color: #fff;
    }

    .btn-primary:hover {
      background-color: #1f2937;
    }

    .btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <button onclick="window.location.href='#'" class="btn btn-primary">
  Подробнее
</button>

</body>
</html>
